schema_version: "1.0"

extension:
  id: extension-canvas-design
  name: Canvas Design
  version: "0.1.10"
  description: Provides the default layout and behavior for Canvas Designer. Select presets and extensions to override these defaults.
  category: process
  author: spec-kit-copilot
  repository: https://github.com/nicolehaugen/spec-kit-copilot
  license: MIT

requires:
  speckit_version: ">=1.0.7"

provides:
  commands:
    - name: speckit.extension-canvas-design.load-page
      file: commands/load-page.md
      description: Resolve registered Canvas Design templates and open the Designer once.
    - name: speckit.extension-canvas-design.generate
      file: commands/generate.md
      description: Generate a source-owned workflow canvas from frozen Designer Essentials.
  templates:
    - name: canvas-settings-setup
      file: pages/essentials.json
      description: Essentials fields for canvas identity and workflow naming.
    - name: canvas-settings-artifacts
      file: pages/artifacts.json
      description: Artifacts settings placeholder.
    - name: canvas-settings-appearance
      file: pages/appearance.json
      description: Appearance settings placeholder.
    - name: canvas-stock-description
      file: pages/stock-description.json
      description: Optional Essentials collection description.
    - name: canvas-stock-workflow-heading
      file: pages/stock-workflow-heading.json
      description: Optional Essentials workflow heading.
    - name: canvas-stock-custom-slug
      file: pages/stock-custom-slug.json
      description: Optional Essentials custom slug option.
    - name: canvas-stock-logo
      file: pages/stock-logo.json
      description: Optional image asset for the generated canvas header.

tags:
  - copilot
  - canvas-design
