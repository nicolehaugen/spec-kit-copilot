schema_version: "1.0"

extension:
  id: extension-canvas-design
  name: Canvas Design
  version: "0.1.16"
  description: Provides the default layout and behavior for Canvas Designer. Select presets and extensions to override these defaults.
  category: process
  author: spec-kit-copilot
  repository: https://github.com/nicolehaugen/spec-kit-copilot
  license: MIT

requires:
  speckit_version: ">=1.0.7"

provides:
  commands:
    - name: speckit.extension-canvas-design.load-page
      file: commands/load-page.md
      description: Resolve registered Canvas Design templates and open the Designer once.
    - name: speckit.extension-canvas-design.generate
      file: commands/generate.md
      description: Generate a source-owned workflow canvas from frozen Designer Essentials.
  templates:
    - name: canvas-settings-setup
      file: designer/tabs/essentials.json
      description: Essentials fields for canvas identity and workflow naming.
    - name: canvas-settings-artifacts
      file: designer/tabs/artifacts.json
      description: Artifacts settings placeholder.
    - name: canvas-settings-appearance
      file: designer/tabs/appearance.json
      description: Appearance settings placeholder.
    - name: canvas-stock-description
      file: designer/settings/description.json
      description: Optional Essentials collection description.
    - name: canvas-stock-workflow-heading
      file: designer/settings/workflow-heading.json
      description: Optional Essentials workflow heading.
    - name: canvas-stock-custom-slug
      file: designer/settings/custom-slug.json
      description: Optional Essentials custom slug option.
    - name: canvas-stock-logo
      file: designer/settings/header-logo.json
      description: Optional image asset for the generated canvas header.
    - name: canvas-stock-logo-main-page
      file: designer/settings/main-page-logo.json
      description: Optional independent larger logo for the generated workflow page.
    - name: canvas-stock-image
      file: controls/stock-image/control.json
      description: Shared image value contract and paired adapters.
    - name: canvas-stock-image-designer
      file: controls/stock-image/designer.mjs
      description: Image upload, preview, replacement, and removal in Designer.
    - name: canvas-stock-image-generated
      file: controls/stock-image/generated.mjs
      description: Portable image presentation in generated canvases.
    - name: canvas-stock-text
      file: controls/stock-text/control.json
      description: Shared text value contract and host adapters.
    - name: canvas-stock-text-designer
      file: controls/stock-text/designer.mjs
      description: Text editing in Designer.
    - name: canvas-stock-text-generated
      file: controls/stock-text/generated.mjs
      description: Portable visual text presentation in generated canvases.
    - name: canvas-stock-checkbox
      file: controls/stock-checkbox/control.json
      description: Shared boolean value contract and Designer adapter.
    - name: canvas-stock-checkbox-designer
      file: controls/stock-checkbox/designer.mjs
      description: Boolean editing in Designer.

tags:
  - copilot
  - canvas-design
