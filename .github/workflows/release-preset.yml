name: Release Preset

# Build and publish a preset zip from a tag push or a manual trigger call.

on:
  workflow_call:
    inputs:
      preset_id:
        required: true
        type: string
      version:
        required: true
        type: string
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+'
      - '!extension-*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release
        id: parse
        env:
          SELECTED_PRESET: ${{ inputs.preset_id }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRESET_ID="${TAG%-v*}"
            VERSION="${TAG##*-v}"
          else
            PRESET_ID="$SELECTED_PRESET"
            VERSION="${REQUESTED_VERSION#v}"
            TAG="${PRESET_ID}-v${VERSION}"
          fi

          if [[ ! "$PRESET_ID" =~ ^copilot-[a-z0-9]+(-[a-z0-9]+)*$ ]] ||
             [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ "$TAG" != "${PRESET_ID}-v${VERSION}" ]]; then
            echo "Error: Invalid preset release tag '$TAG'" >&2
            exit 1
          fi

          # Validate preset directory exists
          if [[ ! -d "spec-kit-presets/$PRESET_ID" ]]; then
            echo "Error: Preset directory 'spec-kit-presets/$PRESET_ID' not found" >&2
            exit 1
          fi

          # Validate preset.yml exists
          if [[ ! -f "spec-kit-presets/$PRESET_ID/preset.yml" ]]; then
            echo "Error: spec-kit-presets/$PRESET_ID/preset.yml not found" >&2
            exit 1
          fi

          # Validate identity/version and the exact asset URL against this
          # publishing repository; never rewrite metadata during publication.
          node dev-tools/validate-preset-catalog.mjs "$PRESET_ID" "$VERSION"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "preset_id=$PRESET_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $PRESET_ID v$VERSION"

      - name: Create preset zip
        run: |
          cd "spec-kit-presets/${{ steps.parse.outputs.preset_id }}"
          zip -r "$GITHUB_WORKSPACE/${{ steps.parse.outputs.preset_id }}.zip" . \
            -x '.*' '__pycache__/*'

      - name: Create or verify release tag
        env:
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Error: Tag '$TAG' points to a different commit; refusing to move it." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Error: Release tag '$TAG' is missing." >&2
            exit 1
          else
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          fi

      - name: Generate release notes
        id: notes
        run: |
          PRESET_ID="${{ steps.parse.outputs.preset_id }}"
          VERSION="${{ steps.parse.outputs.version }}"
          CHANGELOG="spec-kit-presets/$PRESET_ID/CHANGELOG.md"

          {
            echo 'body<<EOF'
            if [[ -f "$CHANGELOG" ]]; then
              # Extract the section for this version from CHANGELOG.md
              awk -v ver="$VERSION" '
                /^## \[/ {
                  if (found) exit
                  if (index($0, ver)) found=1
                }
                found { print }
              ' "$CHANGELOG"
            else
              echo "Release $PRESET_ID v$VERSION"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRESET_ID="${{ steps.parse.outputs.preset_id }}"
          TAG="${{ steps.parse.outputs.tag }}"
          VERSION="${{ steps.parse.outputs.version }}"

          gh release create "$TAG" \
            "$PRESET_ID.zip" \
            --verify-tag \
            --latest=false \
            --title "$PRESET_ID v$VERSION" \
            --notes "${{ steps.notes.outputs.body }}"
