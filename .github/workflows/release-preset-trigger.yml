name: Release Preset Trigger

# Call the publisher directly: GITHUB_TOKEN tag pushes do not start workflows.

on:
  workflow_dispatch:
    inputs:
      preset_id:
        description: 'Preset directory name under spec-kit-presets/ (e.g., copilot-sub-agents)'
        required: true
        type: string
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag-and-release:
    uses: ./.github/workflows/release-preset.yml
    permissions:
      contents: write
    with:
      preset_id: ${{ inputs.preset_id }}
      version: ${{ inputs.version }}
