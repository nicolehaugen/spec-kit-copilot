schema_version: "1.0"

preset:
  id: "copilot-vertical-pipeline-test"
  name: "Copilot Vertical Pipeline Test"
  version: "0.1.0"
  description: "Test-only vertical presentation of the generated Workflow pipeline."
  author: "spec-kit-copilot"
  license: "MIT"

requires:
  speckit_version: ">=1.0.7"
  extensions:
    - extension-canvas-design

provides:
  templates:
    - type: "command"
      name: "speckit.extension-canvas-design.load-page"
      file: "commands/load-page.md"
      description: "Register the vertical phase control replacement."
      replaces: "speckit.extension-canvas-design.load-page"
      strategy: "append"
    - type: "template"
      name: "generated-phase-adapter"
      file: "generated/phase-adapter.mjs"
      description: "Show the complete Workflow phase control as a vertical list and card."
      strategy: "replace"

tags:
  - "copilot"
  - "canvas-design"
  - "test"
