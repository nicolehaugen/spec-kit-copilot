schema_version: "1.0"

preset:
  id: "copilot-canvas-values-test"
  name: "Copilot Canvas Values Test"
  version: "0.1.0"
  description: "Test-only typed generated canvas values and processing-only page."
  author: "spec-kit-copilot"
  license: "MIT"

requires:
  speckit_version: ">=1.0.7"
  extensions:
    - extension-canvas-design

provides:
  templates:
    - type: "command"
      name: "speckit.extension-canvas-design.load-page"
      file: "commands/load-page.md"
      description: "Register typed values and their generated consumer."
      replaces: "speckit.extension-canvas-design.load-page"
      strategy: "append"
    - type: "template"
      name: "canvas-value-heading"
      file: "values/heading.json"
      description: "Fixed stock text."
      strategy: "replace"
    - type: "template"
      name: "canvas-value-enabled"
      file: "values/enabled.json"
      description: "Fixed stock boolean."
      strategy: "replace"
    - type: "template"
      name: "canvas-value-choice"
      file: "values/choice.json"
      description: "Fixed typed object."
      strategy: "replace"
    - type: "template"
      name: "canvas-value-note"
      file: "values/note.json"
      description: "Editable canvas-wide text."
      strategy: "replace"
    - type: "template"
      name: "canvas-value-workflow"
      file: "values/workflow.json"
      description: "Workflow provider value."
      strategy: "replace"
    - type: "template"
      name: "canvas-value-workflow-provider"
      file: "values/workflow.mjs"
      description: "Workflow provider module."
      strategy: "replace"
    - type: "template"
      name: "canvas-value-processing"
      file: "values/processing.json"
      description: "Processing-only value."
      strategy: "replace"
    - type: "template"
      name: "canvas-generated-values"
      file: "pages/values.json"
      description: "Generated page consuming the processing value."
      strategy: "replace"
    - type: "template"
      name: "canvas-generated-values-renderer"
      file: "pages/values.mjs"
      description: "Generated value consumer."
      strategy: "replace"

tags:
  - "copilot"
  - "canvas-design"
  - "test"
